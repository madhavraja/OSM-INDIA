name: Build Escrow Marketplace APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. रिपॉजिटरी कोड क्लोन करें
        uses: actions/checkout@v4

      - name: 2. Node.js वातावरण सेटअप करें
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Java JDK 17 सेटअप करें
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Android SDK टूल्स सेटअप करें
        uses: android-actions/setup-android@v3

      - name: 5. डिपेंडेंसी इंस्टॉल करें
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 6. कैमरा व इंटरनेट परमिशन इंजेक्ट करें
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: 7. एंड्रॉइड APK कंपाइल करें
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. तैयार APK को डाउनलोड हेतु अपलोड करें
        uses: actions/upload-artifact@v4
        with:
          name: OSM-INDIA-ESCROW-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
