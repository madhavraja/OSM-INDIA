name: Build Escrow Marketplace APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. रिपॉजिटरी क्लोन करें
        uses: actions/checkout@v4

      - name: 2. Node.js 18 सेटअप करें
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Java JDK 17 सेटअप करें
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Android SDK सेटअप करें
        uses: android-actions/setup-android@v3

      - name: 5. डिपेंडेंसी इंस्टॉल करें
        run: npm install

      - name: 6. Capacitor Android प्रोजेक्ट तैयार और सिंक करें
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. gradlew को चलाने की अनुमति दें
        run: chmod +x android/gradlew

      - name: 8. Debug APK बनाएं
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 9. APK फ़ाइल अपलोड करें
        uses: actions/upload-artifact@v4
        with:
          name: Escrow-Marketplace-APK
          path: android/app/build/outputs/apk/debug/*.apk
